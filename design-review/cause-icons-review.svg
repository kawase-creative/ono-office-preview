<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370"><rect width="1200" height="370" fill="#e3edf9"/><text x="600" y="53" text-anchor="middle" fill="#0a1649" font-family="Hiragino Mincho ProN,serif" font-size="32" font-weight="bold">なぜ、ここまで辛くなってしまうのか？</text><rect x="22" y="80" width="1156" height="266" rx="18" fill="#fff"/><path d="M407 105v213M793 105v213" stroke="#c4d5e6"/><g transform="translate(170,108) scale(1.1)" fill="none" color="#c98e0c" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="40" cy="19" r="8"/><path d="M25 67V48c0-9 6-16 15-16s15 7 15 16v19M35 34l5 8 5-8M40 42v14"/><circle cx="17" cy="28" r="6"/><path d="M6 63V49c0-7 4-12 11-12 3 0 5 1 7 3M14 39l3 6 4-5"/><circle cx="63" cy="28" r="6"/><path d="M74 63V49c0-7-4-12-11-12-3 0-5 1-7 3M66 39l-3 6-4-5"/></g><g fill="#0a1649" text-anchor="middle" font-family="Hiragino Kaku Gothic ProN,sans-serif"><text x="214" y="241" font-size="21" font-weight="bold">支店内に詳しい人が少ない</text><text x="214" y="278" font-size="17">融資に詳しい人がそもそも少なく、</text><text x="214" y="306" font-size="17">気軽に聞ける環境がない。</text></g><g transform="translate(556,108) scale(1.1)" fill="none" color="#c98e0c" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M40 19C29 12 17 12 7 17v43c11-5 22-4 33 3 11-7 22-8 33-3V17c-10-5-22-5-33 2Zm0 0v44M7 23H3v43c13-4 25-2 37 4 12-6 24-8 37-4V23h-4M15 26c6-1 11 0 17 3M15 35c6-1 11 0 17 3M15 44c6-1 11 0 17 3M48 29c6-3 11-4 17-3M48 38c6-3 11-4 17-3M48 47c6-3 11-4 17-3"/></g><g fill="#0a1649" text-anchor="middle" font-family="Hiragino Kaku Gothic ProN,sans-serif"><text x="600" y="241" font-size="21" font-weight="bold">社内マニュアルがわかりづらい</text><text x="600" y="278" font-size="17">専門用語が多く、実務に合わない</text><text x="600" y="306" font-size="17">部分がある。</text></g><g transform="translate(942,108) scale(1.1)" fill="none" color="#c98e0c" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M61 44c7 2 12 7 12 13 0 4-2 8-6 10l2 8-11-6c-8 1-16-3-19-9"/><path d="M38 9C21 9 8 19 8 32c0 7 4 13 10 17l-4 14 18-9c2 1 4 1 6 1 17 0 30-10 30-23S55 9 38 9Z"/><circle cx="25" cy="32" r="1.5" fill="currentColor" stroke="none"/><circle cx="38" cy="32" r="1.5" fill="currentColor" stroke="none"/><circle cx="51" cy="32" r="1.5" fill="currentColor" stroke="none"/></g><g fill="#0a1649" text-anchor="middle" font-family="Hiragino Kaku Gothic ProN,sans-serif"><text x="986" y="241" font-size="21" font-weight="bold">聞きたくても聞けない</text><text x="986" y="278" font-size="17">忙しくて教えてもらう余裕がなく、</text><text x="986" y="306" font-size="17">相談しづらい雰囲気がある。</text></g></svg>